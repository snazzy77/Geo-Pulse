[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geo-pulse"
version = "0.1.0"
description = "Agent-orchestrated, schema-adaptive spatial analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "folium>=0.18,<1",
  "httpx>=0.27,<1",
  "kagglehub>=1.0.2,<2",
  "numpy>=1.26,<3",
  "osmnx>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pyproj>=3.6,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "scipy>=1.13,<2",
  "shapely>=2,<3",
  "statsmodels>=0.14,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
parquet = ["pyarrow>=17,<22"]

[project.scripts]
geo-pulse = "geo_pulse.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I"]
ignore = ["B008"]
